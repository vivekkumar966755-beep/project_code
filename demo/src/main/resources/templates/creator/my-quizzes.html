<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My quizzes')}"></head>
<body class="app-shell">
<header th:replace="~{fragments/layout :: header('creator')}"></header>
<main class="page">
    <div class="card">
        <div class="toolbar">
            <div>
                <div class="kicker">Library</div>
                <h2>Quizzes you authored</h2>
            </div>
            <a class="btn" th:href="@{/creator/quizzes/create}">Create quiz</a>
        </div>
        <table>
            <thead>
            <tr>
                <th>Title</th>
                <th>Duration</th>
                <th>Status</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="quiz : ${quizzes}">
                <td th:text="${quiz.title}">Title</td>
                <td th:text="${quiz.duration} + ' min'">10</td>
                <td><span class="badge" th:text="${quiz.status}">PENDING</span></td>
                <td>
                    <a class="btn ghost" th:href="@{/creator/quizzes/{id}/add-questions(id=${quiz.id})}">Questions</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(quizzes)}">
                <td colspan="4" class="empty">You have not created a quiz yet.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
