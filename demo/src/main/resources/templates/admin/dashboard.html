<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin')}"></head>
<body class="app-shell">
<header th:replace="~{fragments/layout :: header('admin')}"></header>
<main class="page">
    <div class="kicker">Administration</div>
    <h1>Control room</h1>
    <p class="muted">Monitor the catalog, people, and assessment throughput.</p>
    <div class="stats">
        <div class="stat"><span>Users</span><strong th:text="${userCount}">0</strong></div>
        <div class="stat"><span>Pending quizzes</span><strong th:text="${pendingCount}">0</strong></div>
        <div class="stat"><span>Published</span><strong th:text="${approvedCount}">0</strong></div>
        <div class="stat"><span>Attempts</span><strong th:text="${resultCount}">0</strong></div>
    </div>
    <div class="actions">
        <a class="btn" th:href="@{/admin/users}">Manage users</a>
        <a class="btn secondary" th:href="@{/admin/quizzes}">Review quizzes</a>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
