<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Take quiz')}"></head>
<body class="app-shell">
<header th:replace="~{fragments/layout :: header('quizzes')}"></header>
<main class="page">
    <div class="card">
        <div class="toolbar">
            <div>
                <div class="kicker">Timed attempt</div>
                <h2 th:text="${quiz.title}">Quiz</h2>
            </div>
            <div>
                <span class="muted">Remaining</span>
                <strong th:attr="data-duration-minutes=${quiz.duration}">--:--</strong>
            </div>
        </div>
        <form th:action="@{/quizzes/{id}/submit(id=${quiz.id})}" method="post" data-auto-submit>
            <div th:each="question, iterStat : ${quiz.questions}" class="question-card">
                <p><strong><span th:text="${iterStat.count}">1</span>. <span th:text="${question.questionText}">Question</span></strong></p>
                <label class="choice">
                    <input type="radio" th:name="'question_' + ${question.id}" value="A" required/>
                    <span th:text="${question.optionA}">A</span>
                </label>
                <label class="choice">
                    <input type="radio" th:name="'question_' + ${question.id}" value="B"/>
                    <span th:text="${question.optionB}">B</span>
                </label>
                <label class="choice">
                    <input type="radio" th:name="'question_' + ${question.id}" value="C"/>
                    <span th:text="${question.optionC}">C</span>
                </label>
                <label class="choice">
                    <input type="radio" th:name="'question_' + ${question.id}" value="D"/>
                    <span th:text="${question.optionD}">D</span>
                </label>
            </div>
            <button class="btn" type="submit">Submit answers</button>
        </form>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
